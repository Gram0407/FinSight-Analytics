<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinSight Analytics — Register</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050810;--surface:#0c1020;--surface2:#111827;--border:rgba(99,179,237,0.12);--border2:rgba(99,179,237,0.25);--accent:#38bdf8;--accent2:#818cf8;--green:#34d399;--red:#f87171;--text:#e2e8f0;--muted:#64748b;--muted2:#94a3b8}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:30px 0}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(56,189,248,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,0.04) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.glow{position:fixed;width:600px;height:600px;border-radius:50%;filter:blur(140px);pointer-events:none}
.glow-1{top:-200px;left:-200px;background:rgba(129,140,248,0.06)}
.glow-2{bottom:-200px;right:-200px;background:rgba(56,189,248,0.06)}
.card{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:40px;width:100%;max-width:460px;position:relative;z-index:1;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:24px;justify-content:center}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:#fff}
.logo-text{font-family:'Space Mono',monospace;font-size:16px;font-weight:700}
.logo-sub{font-size:10px;color:var(--muted)}
h2{font-size:21px;font-weight:700;margin-bottom:4px;text-align:center}
.subtitle{font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--muted2);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px}
.form-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);outline:none;transition:border-color 0.2s}
.form-input:focus{border-color:var(--accent)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;padding:13px;border-radius:10px;font-size:14px;font-weight:700;border:none;cursor:pointer;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;transition:opacity 0.2s,transform 0.1s;margin-top:6px}
.btn:hover{opacity:0.9;transform:translateY(-1px)}
.link-row{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
.link-row a{color:var(--accent);text-decoration:none;font-weight:600}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}
.msg.error{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.2);color:var(--red)}
.msg.success{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.2);color:var(--green)}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="card">
  <div class="logo">
    <div class="logo-icon">FS</div>
    <div><div class="logo-text">FinSight Analytics</div><div class="logo-sub">MBA Banking Technology · Pondicherry University</div></div>
  </div>
  <h2>Create Account</h2>
  <div class="subtitle">Join the FinSight platform for macroeconomic stock analysis</div>
  <div class="msg" id="msg"></div>
  <div class="form-grid">
    <div class="form-group">
      <label class="form-label">Username</label>
      <input class="form-input" type="text" id="username" placeholder="johndoe" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label">Phone</label>
      <input class="form-input" type="tel" id="phone" placeholder="+91 9876543210">
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">Email Address</label>
    <input class="form-input" type="email" id="email" placeholder="you@example.com" autocomplete="email">
  </div>
  <div class="form-group">
    <label class="form-label">Password</label>
    <input class="form-input" type="password" id="password" placeholder="Minimum 6 characters" autocomplete="new-password">
  </div>
  <div class="form-group">
    <label class="form-label">Preferred Broker</label>
    <select class="form-input" id="broker">
      <option>Zerodha</option><option>Upstox</option><option>Angel One</option>
      <option>HDFC Securities</option><option>Groww</option><option>5Paisa</option><option>ICICI Direct</option>
    </select>
  </div>
  <button class="btn" onclick="doRegister()" id="regBtn">Create Account →</button>
  <div class="link-row">Already have an account? <a href="/login">Sign in</a></div>
</div>
<script>
function doRegister() {
  const username=document.getElementById('username').value.trim();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const phone=document.getElementById('phone').value.trim();
  const btn=document.getElementById('regBtn');
  if(!username||!email||!password){showMsg('Please fill in all required fields.','error');return;}
  if(password.length<6){showMsg('Password must be at least 6 characters.','error');return;}
  btn.textContent='Creating account...';btn.disabled=true;
  const fd=new FormData();fd.append('username',username);fd.append('email',email);fd.append('password',password);fd.append('phone',phone);
  fetch('/register',{method:'POST',body:fd}).then(r=>r.json()).then(data=>{
    if(data.success){showMsg('Account created! Redirecting to login...','success');setTimeout(()=>window.location=data.redirect,1000);}
    else{showMsg(data.message||'Registration failed','error');btn.textContent='Create Account →';btn.disabled=false;}
  }).catch(()=>{showMsg('Network error. Please try again.','error');btn.textContent='Create Account →';btn.disabled=false;});
}
function showMsg(text,type){const el=document.getElementById('msg');el.textContent=text;el.className='msg '+type;el.style.display='block';}
</script>
</body>
</html>
